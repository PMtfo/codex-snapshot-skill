name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Ruff (best-effort, non-blocking)
        run: |
          pip install ruff
          # 只做语法/未用导入等基础检查,不做严格风格;失败不阻断
          ruff check --select=E9,F63,F7,F82 . || true
